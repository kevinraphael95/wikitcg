<body>

<div class="bg-glow"></div>

<!-- HERO -->
<header class="hero">

  <div class="hero-top">
    <div class="hero-runes">✦ ✦ ✦</div>

    <h1>WikiTCG</h1>

    <p>
      Chaque article Wikipédia devient une carte légendaire
    </p>
  </div>

</header>

<!-- MAIN -->
<main class="app-shell">

  <!-- LEFT PANEL -->
  <section class="control-panel">

    <div class="search-card">

      <div class="search-input-wrap">
        <span class="search-icon">⚔</span>

        <input
          id="q"
          type="text"
          placeholder="Napoléon, Kraken, Tour Eiffel..."
        >
      </div>

      <button class="btn btn-gold" id="bGen">
        Invoquer
      </button>

    </div>

    <div class="quick-actions">

      <button class="btn btn-glass" id="bDaily">
        📅 Carte du jour
      </button>

      <button class="btn btn-glass" id="bRand">
        ⚄ Aléatoire
      </button>

    </div>

    <div class="switcher">

      <button class="switch active">
        Magic
      </button>

      <button class="switch">
        Yu-Gi-Oh!
      </button>

    </div>

  </section>

  <!-- CARD AREA -->
  <section class="viewer">

    <div class="viewer-glow"></div>

    <div id="out" class="card-stage">

      <!-- MTG -->
      <div id="view-mtg">

        <article class="mtg-card">
          ...
        </article>

      </div>

      <!-- YGO -->
      <div id="view-ygo" class="hidden">

        <article class="ygo-card">
          ...
        </article>

      </div>

    </div>

    <a class="wiki-link">
      Lire l'article Wikipédia
    </a>

  </section>

</main>

</body>

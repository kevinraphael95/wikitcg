<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WikiTCG — Chaque article devient une carte</title>
<meta name="description" content="Transformez n'importe quel article Wikipédia en carte Magic ou Yu-Gi-Oh.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Fond ambiant animé ── -->
<div class="bg-orbs" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="bg-grid" aria-hidden="true"></div>

<!-- ── Theme toggle ── -->
<button class="theme-btn" id="themeBtn" aria-label="Changer de thème" title="Changer de thème">
  <span class="theme-icon">☽</span>
</button>

<!-- ── Header ── -->
<header class="site-header">
  <div class="header-eyebrow">
    <span class="eyebrow-line"></span>
    <span class="eyebrow-text">W I K I T C G</span>
    <span class="eyebrow-line"></span>
  </div>
  <h1 class="site-title">
    <span class="title-glow" aria-hidden="true">WikiTCG</span>
    WikiTCG
  </h1>
  <p class="site-sub">Chaque article Wikipédia devient une carte</p>
</header>

<!-- ── UI de recherche ── -->
<section class="search-section" aria-label="Recherche d'article">
  <div class="search-container">
    <div class="search-field-wrap">
      <svg class="search-ico" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M3 9a6 6 0 1 0 12 0A6 6 0 0 0 3 9ZM15.5 15.5l-3.3-3.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input
        id="q"
        type="text"
        class="search-input"
        placeholder="Napoléon, Kraken, Tour Eiffel…"
        autocomplete="off"
        spellcheck="false"
        aria-label="Rechercher un article Wikipédia"
      >
      <button class="search-clear" id="qClear" aria-label="Effacer" tabindex="-1">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <button class="btn-invoke" id="bGen">
      <span>Invoquer</span>
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3l1.6 4.8H17l-4.1 3 1.6 4.8L10 13l-4.5 2.6 1.6-4.8L3 8h5.4L10 3Z" fill="currentColor"/></svg>
    </button>
  </div>
  <div class="btn-row">
    <button class="btn-ghost btn-daily" id="bDaily">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 2v4M13 2v4M3 8h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Carte du jour
    </button>
    <button class="btn-ghost btn-rand" id="bRand">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2 6h3l2 3-2 3H2M15 4l3 2-3 2M15 12l3 2-3 2M5 6l10 2M5 14l10-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Aléatoire
    </button>
  </div>
</section>

<!-- ── Loader ── -->
<div id="loader" class="loader hidden" role="status" aria-live="polite">
  <div class="loader-rune" aria-hidden="true">᛭</div>
  <div class="loader-dots" aria-hidden="true"><span></span><span></span><span></span></div>
  <p class="loader-label">Consultation des archives…</p>
</div>

<!-- ── Erreur ── -->
<div id="err" class="err-msg hidden" role="alert"></div>

<!-- ── Zone carte ── -->
<div id="out" class="card-zone hidden">

  <!-- Mode switch -->
  <div class="mode-switch" role="tablist" aria-label="Format de carte">
    <button class="mode-tab tab-mtg active" id="btnMTG" role="tab" aria-selected="true" onclick="switchMode('mtg')">
      <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 2L11 7h5L12 10.5l2 5L9 13l-5 2.5 2-5L2 7h5L9 2Z" fill="currentColor"/></svg>
      Magic
    </button>
    <button class="mode-tab tab-ygo" id="btnYGO" role="tab" aria-selected="false" onclick="switchMode('ygo')">
      <svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 1l2.5 6h6.5l-5.3 3.8 2 6.2L9 13.3l-5.7 3.7 2-6.2L.5 7H7L9 1Z" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
      Yu-Gi-Oh!
    </button>
  </div>

  <!-- MTG view -->
  <div id="view-mtg" class="card-view" role="tabpanel" aria-labelledby="btnMTG">
    <div class="mtg-card" id="mc">
      <div class="mtg-foil" aria-hidden="true"></div>
      <!-- Header -->
      <div class="mtg-header">
        <span class="mtg-name" id="mc-name"></span>
        <div class="mtg-mana" id="mc-mana" aria-label="Coût de mana"></div>
      </div>
      <!-- Art -->
      <div class="mtg-art-wrap">
        <img id="mc-img" src="" alt="" loading="lazy">
        <div class="mtg-art-ph" id="mc-ph" aria-hidden="true"></div>
        <div class="mtg-art-shine" aria-hidden="true"></div>
      </div>
      <!-- Type line -->
      <div class="mtg-typeline">
        <span id="mc-typetxt"></span>
        <span class="mtg-rarity" id="mc-rarity"></span>
      </div>
      <!-- Text box -->
      <div class="mtg-textbox">
        <div class="mtg-kw" id="mc-kw"></div>
        <div class="mtg-ab" id="mc-ab"></div>
        <div class="mtg-divider" id="mc-div"></div>
        <div class="mtg-flav" id="mc-flav"></div>
      </div>
      <!-- Footer -->
      <div class="mtg-footer">
        <span class="mtg-set">WIKITCG • FR</span>
        <div class="mtg-pt-box" id="mc-pt-box">
          <span class="mtg-pt" id="mc-pt"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- YGO view -->
  <div id="view-ygo" class="card-view hidden" role="tabpanel" aria-labelledby="btnYGO">
    <div class="ygo-card" id="yc">
      <!-- Header -->
      <div class="ygo-header">
        <span class="ygo-name" id="yc-name"></span>
        <div class="ygo-attr" id="yc-attr" aria-label="Attribut"></div>
      </div>
      <!-- Level row -->
      <div class="ygo-level-row" id="yc-level-row">
        <div class="ygo-stars" id="yc-stars" aria-label="Niveau"></div>
      </div>
      <!-- Art -->
      <div class="ygo-art-frame">
        <div class="ygo-art-inner">
          <img id="yc-img" src="" alt="" loading="lazy">
          <div class="ygo-art-ph" id="yc-ph" aria-hidden="true"></div>
        </div>
      </div>
      <!-- Type -->
      <div class="ygo-typebar">
        <span id="yc-subtype"></span>
      </div>
      <!-- Textbox -->
      <div class="ygo-textbox">
        <div class="ygo-bracket" id="yc-bracket"></div>
        <div class="ygo-eff" id="yc-eff"></div>
        <div class="ygo-flav" id="yc-flav"></div>
      </div>
      <!-- Stats -->
      <div class="ygo-stats" id="yc-stats" aria-label="Statistiques"></div>
      <!-- Footer -->
      <div class="ygo-footer">
        <div class="ygo-holo" aria-hidden="true"></div>
        <span class="ygo-serial" id="yc-serial"></span>
        <span class="ygo-copy" aria-hidden="true">©WIKITCG</span>
      </div>
    </div>
  </div>

  <!-- Wiki link -->
  <a class="wiki-link" id="wikiLink" href="#" target="_blank" rel="noopener noreferrer" aria-label="Lire l'article Wikipédia">
    <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-3M10 2h4v4M14 2L8 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Lire l'article Wikipédia
  </a>

</div><!-- /card-zone -->

<script src="app.js"></script>
</body>
</html>
